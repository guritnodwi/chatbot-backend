<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 16px; }
  #chatBox { border: 1px solid #ccc; border-radius: 8px; padding: 12px; height: 400px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .user { background: #111; color: #fff; margin-left: auto; text-align: right; }
  .bot { background: #e5e5e5; color: #111; }
  #inputRow { display: flex; gap: 8px; }
  #userInput { flex: 1; padding: 10px; font-size: 15px; }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
  #configBox { margin-bottom: 16px; font-size: 13px; color: #555; }
  #configBox input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
  #filterBox { margin-bottom: 16px; font-size: 13px; color: #555; }
  #filterBox .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
  #filterBox label.opt { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: #222; }
  #filterBox small { color: #888; }
</style>
</head>
<body>
  <h2>🤖 Test Chatbot</h2>

  <div id="configBox">
    <label>URL Backend (isi otomatis, ganti kalau beda):</label>
    <input type="text" id="backendUrl" value="https://chatbot-backend-production-3798.up.railway.app/api/chat">
  </div>

  <div id="filterBox">
    <label>Filter file .docx (kosongkan = pakai semua):</label>
    <div class="opts" id="filterOpts"><small>Memuat...</small></div>
  </div>

  <div id="chatBox"></div>

  <div id="inputRow">
    <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') kirim()">
    <button onclick="kirim()">Kirim</button>
  </div>

<script>
  let history = [];

  // URL /api/sources diturunkan dari URL /api/chat
  const sourcesUrl = () => document.getElementById("backendUrl").value.replace(/\/chat\/?$/, "/sources");

  async function muatFilter() {
    const box = document.getElementById("filterOpts");
    try {
      const res = await fetch(sourcesUrl());
      const data = await res.json();
      box.innerHTML = "";
      if (!data.sources || !data.sources.length) {
        box.innerHTML = "<small>Belum ada file .docx.</small>";
        return;
      }
      data.sources.forEach((s) => {
        const lbl = document.createElement("label");
        lbl.className = "opt";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = s.name;
        lbl.append(cb, document.createTextNode(s.label + " (" + s.entries + ")"));
        box.appendChild(lbl);
      });
    } catch (err) {
      box.innerHTML = "<small>Gagal memuat filter: " + err.message + "</small>";
    }
  }

  function filterTerpilih() {
    return [...document.querySelectorAll("#filterOpts input:checked")].map((c) => c.value);
  }

  document.getElementById("backendUrl").addEventListener("change", muatFilter);
  muatFilter();

  function tambahPesan(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    document.getElementById("chatBox").appendChild(div);
    document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
  }

  async function kirim() {
    const input = document.getElementById("userInput");
    const pesan = input.value.trim();
    if (!pesan) return;

    tambahPesan("user", pesan);
    history.push({ role: "user", content: pesan });
    input.value = "";
    tambahPesan("bot", "Mengetik...");

    const url = document.getElementById("backendUrl").value;

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, sources: filterTerpilih() })
      });
      const data = await res.json();

      // hapus "Mengetik..."
      document.getElementById("chatBox").lastChild.remove();

      if (res.ok) {
        tambahPesan("bot", data.reply + "  [sumber: " + data.source + (data.file ? " / " + data.file : "") + "]");
        history.push({ role: "assistant", content: data.reply });
      } else {
        tambahPesan("bot", "Error: " + (data.error || "tidak diketahui"));
      }
    } catch (err) {
      document.getElementById("chatBox").lastChild.remove();
      tambahPesan("bot", "Gagal terhubung ke server: " + err.message);
    }
  }
</script>
</body>
</html>

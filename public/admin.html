<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Update FAQ Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  input, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; font-size: 15px; }
  button { background: #111; color: #fff; border: none; cursor: pointer; margin-top: 16px; }
  button:disabled { background: #999; }
  #msg { margin-top: 14px; font-size: 14px; }
  .ok { color: green; }
  .err { color: #c00; }
  #upload-section { display: none; margin-top: 24px; border-top: 1px solid #ddd; padding-top: 20px; }
</style>
</head>
<body>
  <h1>🔒 Admin — Update FAQ Chatbot</h1>

  <div id="login-section">
    <label>Password Admin</label>
    <input type="password" id="password" placeholder="Masukkan password">
    <button id="btnLogin">Masuk</button>
  </div>

  <div id="upload-section">
    <p>Login berhasil. Upload file <b>.docx</b> baru untuk mengganti data FAQ:</p>
    <input type="file" id="file" accept=".docx">
    <button id="btnUpload">Upload &amp; Ganti Data</button>
    <button id="btnReload" style="background:#555;">Muat Ulang File yang Ada</button>
  </div>

  <div id="msg"></div>

<script>
  let savedPassword = "";
  const msg = document.getElementById("msg");

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.className = isError ? "err" : "ok";
  }

  document.getElementById("btnLogin").onclick = async () => {
    const password = document.getElementById("password").value;
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "x-admin-password": password }
    });
    if (res.ok) {
      savedPassword = password;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("upload-section").style.display = "block";
      showMsg("Login berhasil.", false);
    } else {
      showMsg("Password salah.", true);
    }
  };

  document.getElementById("btnUpload").onclick = async () => {
    const fileInput = document.getElementById("file");
    if (!fileInput.files.length) return showMsg("Pilih file .docx dulu.", true);

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    showMsg("Mengupload...", false);
    const res = await fetch("/api/admin/upload-faq", {
      method: "POST",
      headers: { "x-admin-password": savedPassword },
      body: formData
    });
    const data = await res.json();
    if (res.ok) {
      showMsg(`Berhasil! FAQ diperbarui, ${data.faqCount} entri terbaca.`, false);
    } else {
      showMsg("Gagal: " + data.error, true);
    }
  };

  document.getElementById("btnReload").onclick = async () => {
    const res = await fetch("/api/admin/reload-faq", {
      method: "POST",
      headers: { "x-admin-password": savedPassword }
    });
    const data = await res.json();
    if (res.ok) {
      showMsg(`Dimuat ulang, ${data.faqCount} entri terbaca.`, false);
    } else {
      showMsg("Gagal memuat ulang.", true);
    }
  };
</script>
</body>
</html>

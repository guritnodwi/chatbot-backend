<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Update FAQ Chatbot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  input, button { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; font-size: 15px; }
  button { background: #111; color: #fff; border: none; cursor: pointer; margin-top: 16px; }
  button:disabled { background: #999; }
  #msg { margin-top: 14px; font-size: 14px; }
  .ok { color: green; }
  .err { color: #c00; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  td button { width: auto; margin: 0; padding: 4px 10px; background: #c00; font-size: 13px; }
  #upload-section { display: none; margin-top: 24px; border-top: 1px solid #ddd; padding-top: 20px; }
</style>
</head>
<body>
  <h1>🔒 Admin — Update FAQ Chatbot</h1>

  <div id="login-section">
    <label>Password Admin</label>
    <input type="password" id="password" placeholder="Masukkan password">
    <button id="btnLogin">Masuk</button>
  </div>

  <div id="upload-section">
    <p>Login berhasil. Chatbot membaca <b>semua file .docx</b> di bawah ini sekaligus.</p>
    <table>
      <thead><tr><th>File</th><th>Entri</th><th></th></tr></thead>
      <tbody id="fileList"><tr><td colspan="3">Memuat...</td></tr></tbody>
    </table>
    <p style="margin-top:20px">Tambah / ganti file (bisa pilih banyak sekaligus; nama sama = menimpa):</p>
    <input type="file" id="file" accept=".docx" multiple>
    <button id="btnUpload">Upload</button>
    <button id="btnReload" style="background:#555;">Muat Ulang Semua File</button>
  </div>

  <div id="msg"></div>

<script>
  let savedPassword = "";
  const msg = document.getElementById("msg");

  function showMsg(text, isError) {
    msg.textContent = text;
    msg.className = isError ? "err" : "ok";
  }

  document.getElementById("btnLogin").onclick = async () => {
    const password = document.getElementById("password").value;
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "x-admin-password": password }
    });
    if (res.ok) {
      savedPassword = password;
      document.getElementById("login-section").style.display = "none";
      document.getElementById("upload-section").style.display = "block";
      showMsg("Login berhasil.", false);
      refreshList();
    } else {
      showMsg("Password salah.", true);
    }
  };

  const authHeader = () => ({ "x-admin-password": savedPassword });

  async function refreshList() {
    const res = await fetch("/api/admin/files", { headers: authHeader() });
    const data = await res.json();
    const tbody = document.getElementById("fileList");
    tbody.innerHTML = "";
    if (!data.files.length) {
      tbody.innerHTML = '<tr><td colspan="3">Belum ada file.</td></tr>';
      return;
    }
    data.files.forEach((f) => {
      const tr = document.createElement("tr");
      const tdName = document.createElement("td");
      tdName.textContent = f.name;
      const tdCount = document.createElement("td");
      tdCount.textContent = f.entries;
      const tdBtn = document.createElement("td");
      const btn = document.createElement("button");
      btn.textContent = "Hapus";
      btn.onclick = async () => {
        if (!confirm("Hapus " + f.name + "?")) return;
        const r = await fetch("/api/admin/files/" + encodeURIComponent(f.name), {
          method: "DELETE", headers: authHeader()
        });
        showMsg(r.ok ? f.name + " dihapus." : "Gagal menghapus.", !r.ok);
        refreshList();
      };
      tdBtn.appendChild(btn);
      tr.append(tdName, tdCount, tdBtn);
      tbody.appendChild(tr);
    });
  }

  document.getElementById("btnUpload").onclick = async () => {
    const fileInput = document.getElementById("file");
    if (!fileInput.files.length) return showMsg("Pilih minimal satu file .docx dulu.", true);

    const formData = new FormData();
    for (const f of fileInput.files) formData.append("files", f);

    showMsg("Mengupload...", false);
    const res = await fetch("/api/admin/upload-faq", {
      method: "POST", headers: authHeader(), body: formData
    });
    const data = await res.json();
    if (res.ok) {
      let text = `Berhasil! ${data.tersimpan.length} file tersimpan, total ${data.faqCount} entri FAQ.`;
      if (data.ditolak.length) text += ` Ditolak (bukan .docx valid): ${data.ditolak.join(", ")}`;
      showMsg(text, data.ditolak.length > 0);
      fileInput.value = "";
      refreshList();
    } else {
      showMsg("Gagal: " + data.error, true);
    }
  };

  document.getElementById("btnReload").onclick = async () => {
    const res = await fetch("/api/admin/reload-faq", { method: "POST", headers: authHeader() });
    const data = await res.json();
    showMsg(res.ok ? `Dimuat ulang, ${data.faqCount} entri terbaca.` : "Gagal memuat ulang.", !res.ok);
    refreshList();
  };
</script>
</body>
</html>
